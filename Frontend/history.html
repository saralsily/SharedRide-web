<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Rides</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #e0f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0277bd;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            padding: 14px;
            text-align: left;
        }
        th {
            background-color: #81d4fa;
            color: #01579b;
        }
        tr:nth-child(even) {
            background-color: #e1f5fe;
        }
        tr:hover {
            background-color: #b3e5fc;
        }

        .cancel-ride-btn {
    padding: 8px 12px;
    background-color: #d32f2f;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.cancel-ride-btn:hover {
    background-color: #9a0007;
}

.cancel-ride-btn:disabled {
    background-color: #999;
    cursor: not-allowed;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Past Rides</h1>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Driver</th>
<th>Status</th>
<th>Action</th>                </tr>
            </thead>
            <tbody>
                <tr>
               <tbody id="historyBody">
</tbody>
            </tbody>
        </table>
    </div>
    <script>
    function displayRideHistory() {
        const historyBody = document.getElementById("historyBody");
        const ride = JSON.parse(localStorage.getItem("lastRide"));

        if (!ride) {
            historyBody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center;">No rides yet.</td>
                </tr>
            `;
            return;
        }

        const rideDate = ride.createdAt 
            ? new Date(ride.createdAt).toLocaleDateString()
            : "Today";

        const isCancelled = ride.status === "Cancelled";

        historyBody.innerHTML = `
            <tr>
                <td>${rideDate}</td>
                <td>${ride.pickup}</td>
                <td>${ride.dropoff}</td>
                <td>${ride.driverName}</td>
                <td>${ride.status}</td>
                <td>
                    <button class="cancel-ride-btn" onclick="cancelRide()" ${isCancelled ? "disabled" : ""}>
                        ${isCancelled ? "Cancelled" : "Cancel Ride"}
                    </button>
                </td>
            </tr>
        `;
    }

    function cancelRide() {
        const ride = JSON.parse(localStorage.getItem("lastRide"));

        if (!ride) {
            alert("No ride found.");
            return;
        }

        ride.status = "Cancelled";
        localStorage.setItem("lastRide", JSON.stringify(ride));

        displayRideHistory();
    }

    displayRideHistory();
</script>
</body>
</html>
